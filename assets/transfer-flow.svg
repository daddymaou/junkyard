<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-labelledby="title description">
  <title id="title">Junkyard transfer flow</title>
  <desc id="description">A sender uploads a file through the Junkyard server. The receiver enters the separately shared code and retrieves the file.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10" fill="none" stroke="#8B929A" stroke-width="1.5"/>
    </marker>
    <marker id="amber-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10" fill="none" stroke="#FFB000" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1400" height="420" rx="12" fill="#0B0D0F"/>

  <text x="700" y="48" fill="#8B929A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="2" text-anchor="middle">A CODE CONNECTS TWO TERMINALS</text>

  <rect x="72" y="112" width="330" height="190" rx="8" fill="#141719" stroke="#3D444D"/>
  <text x="104" y="154" fill="#8B929A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="1.5">SENDER</text>
  <text x="104" y="204" fill="#E6E8EB" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700">junkyard send</text>
  <text x="104" y="242" fill="#8B929A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">file.zip</text>
  <text x="104" y="278" fill="#FFB000" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">uploads file</text>

  <rect x="535" y="112" width="330" height="190" rx="8" fill="#141719" stroke="#3D444D"/>
  <text x="567" y="154" fill="#8B929A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="1.5">TRANSFER SERVER</text>
  <text x="567" y="204" fill="#E6E8EB" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700">Junkyard relay</text>
  <text x="567" y="242" fill="#8B929A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">matches code to file</text>
  <text x="567" y="278" fill="#8B929A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">file data passes through</text>

  <rect x="998" y="112" width="330" height="190" rx="8" fill="#141719" stroke="#3D444D"/>
  <text x="1030" y="154" fill="#8B929A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="1.5">RECEIVER</text>
  <text x="1030" y="204" fill="#E6E8EB" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="23" font-weight="700">junkyard receive</text>
  <text x="1030" y="242" fill="#8B929A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">enters the code</text>
  <text x="1030" y="278" fill="#FFB000" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">downloads file</text>

  <path d="M402 207h123" fill="none" stroke="#8B929A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="463" y="188" fill="#8B929A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" text-anchor="middle">FILE</text>
  <path d="M865 207h123" fill="none" stroke="#8B929A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="927" y="188" fill="#8B929A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" text-anchor="middle">FILE</text>

  <path d="M237 302v48h926v-48" fill="none" stroke="#FFB000" stroke-width="1.5" stroke-dasharray="6 7" marker-end="url(#amber-arrow)"/>
  <rect x="534" y="328" width="334" height="38" rx="6" fill="#0B0D0F"/>
  <text x="701" y="353" fill="#FFB000" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" text-anchor="middle">SHARE THE CODE SEPARATELY · TYPE OR SCAN</text>
</svg>
